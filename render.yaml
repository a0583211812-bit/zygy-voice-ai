services:
  - type: web
    name: zygy-voice-ai
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: EXT_PATH
        value: "6"
      - key: TEXT_MODEL
        value: "Gemini 1.5 Flash-8B"
      - key: TTS_MODEL
        value: "gemini-1.5-flash"
      - key: EXTENSIONS
        value: "[{\"p\":\"6\",\"m\":\"2\",\"g\":\"שלום שאל אותי כל דבר ובסיום הקש סולמית\",\"x\":\"\"}]"
      - key: MAX_WORDS
        value: "199"
      - key: EXTRA_INSTRUCTION
        value: ""
      - key: GEMINI_API_KEYS
        sync: false
      - key: GEMINI_TTS_KEYS
        sync: false
      - key: YEMOT_TOKEN
        sync: false
